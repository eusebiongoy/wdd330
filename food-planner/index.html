<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Food & Grocery Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Header / Logo -->
    <header>
        <h1>Smart Food & Grocery Planner</h1>
        <input type="search" id="recipe-search" placeholder="Search Recipes 🔍">
    </header>

    <!-- Main content -->
    <main>
        <section id="weekly-planner">
            <h2>Weekly Planner</h2>
            <div id="planner-grid">
                <!-- Calendar grid will go here -->
            </div>
        </section>

        <section id="grocery-list">
            <h2>Grocery List 🛒</h2>
            <ul id="grocery-items">
                <!-- Grocery items added here -->
            </ul>
        </section>

        <section id="recipe-view">
            <h2>Recipe Details</h2>
            <div id="recipe-info">
                <!-- Recipe image, ingredients, instructions -->
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
