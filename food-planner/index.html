<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Food & Grocery Planner</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>🥗 Smart Food & Grocery Planner</h1>

        <input type="search" id="recipe-search" placeholder="Search recipes 🔍" autocomplete="off" />
    </header>

    <!-- MAIN APP -->
    <main class="container">

        <!-- LEFT: Weekly Planner -->
        <section id="weekly-planner" class="card">
            <h2>📅 Weekly Planner</h2>

            <div id="planner-grid">
                <!-- JS will generate calendar grid here -->
            </div>
        </section>

        <!-- CENTER: Recipes -->
        <section id="recipe-section" class="card">
            <h2>🍽️ Recipes</h2>

            <!-- IMPORTANT: results should go here (not recipe-info only) -->
            <div id="recipe-results">
                <!-- Recipe cards injected here -->
            </div>
        </section>

        <!-- RIGHT: Grocery List -->
        <section id="grocery-list" class="card">
            <h2>🛒 Grocery List</h2>

            <ul id="grocery-items">
                <!-- Grocery items injected here -->
            </ul>

            <button id="clear-grocery">Clear List</button>
        </section>

    </main>

    <!-- OPTIONAL: Recipe detail modal area (future upgrade) -->
    <section id="recipe-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal">&times;</span>

            <div id="recipe-details">
                <!-- Full recipe info will show here -->
            </div>
        </div>
    </section>

    <!-- JS ENTRY POINT -->
    <script type="module" src="js/app.js"></script>

</body>

</html>
